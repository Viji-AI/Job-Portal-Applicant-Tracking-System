spring:
  application:
    name: job-portal-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:job_portal}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Viji@2005
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'update' is convenient for dev — auto-creates/updates tables from
      # entities. Switch to 'validate' + a migration tool (Flyway/Liquibase)
      # before production.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${SERVER_PORT:5000}

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:replace_this_with_a_long_random_string_min_32_chars}
    refresh-secret: ${JWT_REFRESH_SECRET:replace_this_with_a_different_long_random_string}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 min
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origin: ${CLIENT_URL:http://localhost:5173}
